<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 250" role="img" aria-labelledby="elecSkidTitle elecSkidDesc">
  <title id="elecSkidTitle">Integrated Electrical Skid Concept Elevation</title>
  <desc id="elecSkidDesc">Illustrative side elevation of an integrated electrical skid: switchgear lineup, transformer section, control cabinet, and auxiliary panel mounted on a structural base frame with lifting lugs, beneath an overhead cable tray with conduit drops.</desc>
  <defs>
    <style>
      text{font-family:Arial,Helvetica,sans-serif}
      .geo{fill:#0d6ca8;fill-opacity:.12;stroke:#dce8ee;stroke-width:1.6}
      .geo2{fill:none;stroke:#b8cdd8;stroke-width:1.05}
      .thin{fill:none;stroke:#8fa9b6;stroke-width:.9}
      .hid{fill:none;stroke:#7a99a9;stroke-width:1;stroke-dasharray:5 4}
      .band{fill:#0d6ca8;fill-opacity:.16}
      .lug{fill:#55c3de;fill-opacity:.12;stroke:#9fd8e8;stroke-width:1.6}
      .lughole{fill:#09141c;stroke:#9fd8e8;stroke-width:1.4}
      .gold{fill:none;stroke:#e4a524;stroke-width:1.3}
      .dim{fill:none;stroke:#7eb3ce;stroke-width:1}
      .ext{fill:none;stroke:#7eb3ce;stroke-width:.85;stroke-opacity:.8}
      .dimt{fill:#a9c9db;font-size:9.5px;font-weight:700;letter-spacing:.06em}
      .micro{fill:#91a9b5;font-size:9px;font-weight:600;letter-spacing:.06em}
      .microGold{fill:#e4a524;font-size:9px;font-weight:700;letter-spacing:.08em}
    </style>
    <marker id="arrE" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0 1.4 10 5 0 8.6z" fill="#7eb3ce"/>
    </marker>
  </defs>

  <text x="16" y="16" class="microGold">ILLUSTRATIVE CONCEPT · INTEGRATED ELECTRICAL SKID</text>
  <text x="904" y="16" class="micro" text-anchor="end">NTS</text>

  <!-- overhead cable tray -->
  <line class="geo2" x1="120" y1="44" x2="810" y2="44"/>
  <line class="geo2" x1="120" y1="56" x2="810" y2="56"/>
  <g class="thin">
    <line x1="146" y1="44" x2="146" y2="56"/><line x1="172" y1="44" x2="172" y2="56"/>
    <line x1="198" y1="44" x2="198" y2="56"/><line x1="224" y1="44" x2="224" y2="56"/>
    <line x1="250" y1="44" x2="250" y2="56"/><line x1="276" y1="44" x2="276" y2="56"/>
    <line x1="302" y1="44" x2="302" y2="56"/><line x1="328" y1="44" x2="328" y2="56"/>
    <line x1="354" y1="44" x2="354" y2="56"/><line x1="380" y1="44" x2="380" y2="56"/>
    <line x1="406" y1="44" x2="406" y2="56"/><line x1="432" y1="44" x2="432" y2="56"/>
    <line x1="458" y1="44" x2="458" y2="56"/><line x1="484" y1="44" x2="484" y2="56"/>
    <line x1="510" y1="44" x2="510" y2="56"/><line x1="536" y1="44" x2="536" y2="56"/>
    <line x1="562" y1="44" x2="562" y2="56"/><line x1="588" y1="44" x2="588" y2="56"/>
    <line x1="614" y1="44" x2="614" y2="56"/><line x1="640" y1="44" x2="640" y2="56"/>
    <line x1="666" y1="44" x2="666" y2="56"/><line x1="692" y1="44" x2="692" y2="56"/>
    <line x1="718" y1="44" x2="718" y2="56"/><line x1="744" y1="44" x2="744" y2="56"/>
    <line x1="770" y1="44" x2="770" y2="56"/><line x1="796" y1="44" x2="796" y2="56"/>
  </g>
  <!-- tray supports to equipment tops -->
  <g class="geo2">
    <line x1="208" y1="56" x2="208" y2="70"/><line x1="214" y1="56" x2="214" y2="70"/>
    <line x1="542" y1="56" x2="542" y2="88"/><line x1="548" y1="56" x2="548" y2="88"/>
    <line x1="764" y1="56" x2="764" y2="118"/><line x1="770" y1="56" x2="770" y2="118"/>
  </g>
  <!-- conduit drops -->
  <g class="thin">
    <line x1="425" y1="56" x2="425" y2="96"/><line x1="430" y1="56" x2="430" y2="96"/>
    <line x1="372" y1="56" x2="372" y2="96"/><line x1="377" y1="56" x2="377" y2="96"/>
    <line x1="656" y1="56" x2="656" y2="118"/><line x1="661" y1="56" x2="661" y2="118"/>
  </g>

  <!-- switchgear lineup -->
  <rect class="geo" x="100" y="70" width="220" height="134"/>
  <line class="geo2" x1="173" y1="70" x2="173" y2="204"/>
  <line class="geo2" x1="247" y1="70" x2="247" y2="204"/>
  <g class="thin">
    <rect x="108" y="78" width="57" height="118" fill="none"/>
    <rect x="181" y="78" width="58" height="118" fill="none"/>
    <rect x="255" y="78" width="57" height="118" fill="none"/>
  </g>
  <g class="gold">
    <line x1="160" y1="126" x2="160" y2="142"/>
    <line x1="234" y1="126" x2="234" y2="142"/>
    <line x1="307" y1="126" x2="307" y2="142"/>
  </g>
  <g class="thin">
    <line x1="114" y1="168" x2="159" y2="168"/><line x1="114" y1="175" x2="159" y2="175"/><line x1="114" y1="182" x2="159" y2="182"/><line x1="114" y1="189" x2="159" y2="189"/>
    <line x1="187" y1="168" x2="233" y2="168"/><line x1="187" y1="175" x2="233" y2="175"/><line x1="187" y1="182" x2="233" y2="182"/><line x1="187" y1="189" x2="233" y2="189"/>
    <line x1="261" y1="168" x2="306" y2="168"/><line x1="261" y1="175" x2="306" y2="175"/><line x1="261" y1="182" x2="306" y2="182"/><line x1="261" y1="189" x2="306" y2="189"/>
  </g>
  <circle class="lughole" cx="136" cy="66" r="3"/>
  <circle class="lughole" cx="210" cy="66" r="3"/>
  <circle class="lughole" cx="284" cy="66" r="3"/>

  <!-- transformer section -->
  <rect class="geo" x="345" y="96" width="125" height="108"/>
  <g class="thin">
    <line x1="357" y1="112" x2="458" y2="112"/><line x1="357" y1="119" x2="458" y2="119"/>
    <line x1="357" y1="126" x2="458" y2="126"/><line x1="357" y1="133" x2="458" y2="133"/>
  </g>
  <g class="thin">
    <line x1="352" y1="146" x2="352" y2="198"/><line x1="358" y1="146" x2="358" y2="198"/>
    <line x1="364" y1="146" x2="364" y2="198"/><line x1="370" y1="146" x2="370" y2="198"/>
  </g>
  <circle class="lughole" cx="407" cy="92" r="3"/>

  <!-- control cabinet -->
  <rect class="geo" x="495" y="88" width="105" height="116"/>
  <line class="geo2" x1="547" y1="88" x2="547" y2="204"/>
  <rect class="thin" x="506" y="102" width="26" height="18" fill="none"/>
  <g class="gold">
    <line x1="540" y1="138" x2="540" y2="152"/>
    <line x1="556" y1="138" x2="556" y2="152"/>
  </g>
  <circle class="lughole" cx="547" cy="84" r="3"/>

  <!-- auxiliary panel section -->
  <rect class="geo" x="625" y="118" width="175" height="86"/>
  <line class="geo2" x1="712" y1="118" x2="712" y2="204"/>
  <g class="gold">
    <line x1="704" y1="150" x2="704" y2="164"/>
    <line x1="720" y1="150" x2="720" y2="164"/>
  </g>
  <g class="thin">
    <line x1="634" y1="178" x2="702" y2="178"/><line x1="634" y1="185" x2="702" y2="185"/><line x1="634" y1="192" x2="702" y2="192"/>
    <line x1="722" y1="178" x2="790" y2="178"/><line x1="722" y1="185" x2="790" y2="185"/><line x1="722" y1="192" x2="790" y2="192"/>
  </g>

  <!-- deck plate and base frame -->
  <path class="band" d="M70 204H850v6H70z"/>
  <line class="geo2" x1="70" y1="204" x2="850" y2="204"/>
  <rect class="geo" x="70" y="210" width="780" height="22"/>
  <g class="hid">
    <line x1="150" y1="212" x2="150" y2="230"/><line x1="230" y1="212" x2="230" y2="230"/>
    <line x1="310" y1="212" x2="310" y2="230"/><line x1="390" y1="212" x2="390" y2="230"/>
    <line x1="470" y1="212" x2="470" y2="230"/><line x1="550" y1="212" x2="550" y2="230"/>
    <line x1="630" y1="212" x2="630" y2="230"/><line x1="710" y1="212" x2="710" y2="230"/>
    <line x1="790" y1="212" x2="790" y2="230"/>
  </g>
  <!-- lifting lugs -->
  <rect class="lug" x="54" y="186" width="16" height="46" rx="2"/><circle class="lughole" cx="62" cy="198" r="4.5"/>
  <rect class="lug" x="850" y="186" width="16" height="46" rx="2"/><circle class="lughole" cx="858" cy="198" r="4.5"/>

  <!-- transport envelope dimension -->
  <line class="ext" x1="70" y1="234" x2="70" y2="246"/>
  <line class="ext" x1="850" y1="234" x2="850" y2="246"/>
  <line class="dim" x1="70" y1="243" x2="850" y2="243" marker-start="url(#arrE)" marker-end="url(#arrE)"/>
  <rect x="384" y="236" width="152" height="13" fill="#09141c" fill-opacity=".85"/>
  <text x="460" y="246" class="dimt" text-anchor="middle">TRANSPORT ENVELOPE</text>
</svg>
